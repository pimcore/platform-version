name: Install Check

on:
  workflow_dispatch:

jobs:
  Install-Check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install jq
        run: sudo apt-get install jq

      - name: Install SSH Key # this is necessary for Composer to be able to clone source from pimcore/ee-pimcore
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER }}
          known_hosts: ".... we add this in the next step ;-)"

      - name: "Add authentication for private pimcore packages"
        run: |
          composer config repositories.private-packagist composer https://repo.pimcore.com/github-actions/
          composer config --global --auth http-basic.repo.pimcore.com github-actions ${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}

      - name: Check dependency resolution for each conflict package
        run: |
          cp composer.json composer.json.bak
          has_failure=0
          failed_packages=""
          passed_packages=""

          for package in $(jq -r '.conflict | keys[]' composer.json); do
            # Reset composer.json to original state for each package
            cp composer.json.bak composer.json
            composer require "$package:*" --no-update 2>/dev/null

            output=$(composer update --dry-run 2>/dev/null) || {
              has_failure=1
              failed_packages="$failed_packages $package"

              echo "$output" | php -r '
              $input = file_get_contents("php://stdin");
              $package = $argv[1] ?? "unknown";

              // Split into problem blocks
              preg_match_all("/Problem \d+.*?(?=Problem \d+|\z)/s", $input, $matches);

              if (empty($matches[0])) {
                  echo "FAIL: {$package}" . PHP_EOL;
                  echo "  (could not parse composer output)" . PHP_EOL . PHP_EOL;
                  exit;
              }

              echo "FAIL: {$package}" . PHP_EOL;

              foreach ($matches[0] as $block) {
                  // Collect conflicted versions (trim trailing dots from composer output)
                  preg_match_all("/conflicts with\s+\S+\s+(\S+)/", $block, $conflictVersions);
                  if (!empty($conflictVersions[1])) {
                      $versions = array_map(fn($v) => rtrim($v, "."), $conflictVersions[1]);
                      echo "  Blocked by conflict rule (" . count($versions) . " versions):" . PHP_EOL;
                      echo "    " . implode(", ", $versions) . PHP_EOL;
                  }

                  // PHP version requirements (versions NOT blocked by conflict)
                  preg_match_all("/require php\s+(.+?)\s*->\s*your php version \(([^)]+)\)/", $block, $phpReqs, PREG_SET_ORDER);
                  // Dependency constraint mismatches
                  preg_match_all("/(\S+)\s+requires\s+(\S+)\s+(\S+)\s*->.*but it does not match/", $block, $depReqs, PREG_SET_ORDER);

                  if (!empty($phpReqs) || !empty($depReqs)) {
                      echo "  Remaining versions that fail for other reasons:" . PHP_EOL;
                      $seenPhp = [];
                      foreach ($phpReqs as $req) {
                          $key = $req[1];
                          if (!isset($seenPhp[$key])) {
                              $seenPhp[$key] = true;
                              echo "    - Requires PHP {$req[1]} (installed: {$req[2]})" . PHP_EOL;
                          }
                      }
                      foreach ($depReqs as $req) {
                          echo "    - {$req[1]} requires {$req[2]} {$req[3]} (no matching version)" . PHP_EOL;
                      }
                  }
              }

              echo PHP_EOL;
              ' -- "$package"

              continue
            }

            passed_packages="$passed_packages $package"
            echo "OK: $package"
          done

          # Restore original composer.json
          mv composer.json.bak composer.json

          echo ""
          echo "========================================"
          echo "Summary (individual checks)"
          echo "========================================"
          if [ -n "$passed_packages" ]; then
            echo "PASSED:$(echo "$passed_packages" | tr ' ' '\n' | sort | sed 's/^/  /')"
          fi
          if [ -n "$failed_packages" ]; then
            echo "FAILED:$(echo "$failed_packages" | tr ' ' '\n' | sort | sed 's/^/  /')"
          fi
          echo "========================================"

          if [ "$has_failure" -eq 1 ]; then
            exit 2
          fi

          # All packages passed individually — now check them all together
          echo ""
          echo "All packages passed individually, running combined check..."
          echo ""

          for package in $(jq -r '.conflict | keys[]' composer.json); do
            composer require "$package:*" --no-update 2>/dev/null
          done

          output=$(composer update --dry-run 2>/dev/null) && {
            echo "Combined check passed."
          } || {
            echo "Combined check FAILED — packages conflict with each other:"
            echo ""
            echo "$output" | php -r '
            $input = file_get_contents("php://stdin");

            preg_match_all("/Problem \d+.*?(?=Problem \d+|\z)/s", $input, $matches);

            if (empty($matches[0])) {
                echo $input;
                exit;
            }

            foreach ($matches[0] as $block) {
                $package = "unknown";
                if (preg_match("/requires\s+(\S+)\s+\*/", $block, $m)) {
                    $package = $m[1];
                }

                preg_match("/Problem (\d+)/", $block, $pNum);
                $num = $pNum[1] ?? "?";

                echo "Problem {$num}: {$package}" . PHP_EOL;

                preg_match_all("/conflicts with\s+\S+\s+(\S+)/", $block, $conflictVersions);
                if (!empty($conflictVersions[1])) {
                    $versions = array_map(fn($v) => rtrim($v, "."), $conflictVersions[1]);
                    echo "  Blocked by conflict rule (" . count($versions) . " versions):" . PHP_EOL;
                    echo "    " . implode(", ", $versions) . PHP_EOL;
                }

                preg_match_all("/require php\s+(.+?)\s*->\s*your php version \(([^)]+)\)/", $block, $phpReqs, PREG_SET_ORDER);
                preg_match_all("/(\S+)\s+requires\s+(\S+)\s+(\S+)\s*->.*but it does not match/", $block, $depReqs, PREG_SET_ORDER);

                if (!empty($phpReqs) || !empty($depReqs)) {
                    echo "  Remaining versions that fail for other reasons:" . PHP_EOL;
                    $seenPhp = [];
                    foreach ($phpReqs as $req) {
                        $key = $req[1];
                        if (!isset($seenPhp[$key])) {
                            $seenPhp[$key] = true;
                            echo "    - Requires PHP {$req[1]} (installed: {$req[2]})" . PHP_EOL;
                        }
                    }
                    foreach ($depReqs as $req) {
                        echo "    - {$req[1]} requires {$req[2]} {$req[3]} (no matching version)" . PHP_EOL;
                    }
                }

                echo PHP_EOL;
            }
            '
            exit 2
          }
