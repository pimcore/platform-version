name: Install Check

on:
  workflow_dispatch:

jobs:
  Install-Check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install jq
        run: sudo apt-get install jq

      - name: Install SSH Key # this is necessary for Composer to be able to clone source from pimcore/ee-pimcore
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER }}
          known_hosts: ".... we add this in the next step ;-)"

      - name: "Add authentication for private pimcore packages"
        run: |
          composer config repositories.private-packagist composer https://repo.pimcore.com/github-actions/
          composer config --global --auth http-basic.repo.pimcore.com github-actions ${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}

      - name: Read and modify composer.json
        id: update_composer
        run: |
          original_content=$(<composer.json)
          for conflict in $(echo "$original_content" | jq -r '.conflict | to_entries[] | @base64'); do
            _jq() {
              echo ${conflict} | base64 --decode | jq -r ${1}
            }
            package_name=$(_jq '.key')
            composer require "$package_name:*" --no-update
          done

      - name: Check dependency resolution
        run: |
          output=$(composer update --dry-run 2>&1) && echo "$output" || {
            echo "$output" | php -r '
            $input = file_get_contents("php://stdin");

            // Split into problem blocks
            preg_match_all("/Problem \d+.*?(?=Problem \d+|\z)/s", $input, $matches);

            if (empty($matches[0])) {
                echo $input;
                exit;
            }

            echo "Dependency resolution failed:" . PHP_EOL . PHP_EOL;

            foreach ($matches[0] as $block) {
                // Extract the package name from "requires <package> *"
                $package = "unknown";
                if (preg_match("/requires\s+(\S+)\s+\*/", $block, $m)) {
                    $package = $m[1];
                }

                // Extract problem number
                preg_match("/Problem (\d+)/", $block, $pNum);
                $num = $pNum[1] ?? "?";

                echo "Problem {$num}: {$package}" . PHP_EOL;

                // Count conflict lines
                $conflictCount = preg_match_all("/conflicts with\s+\S+\s+(\S+)/", $block, $conflictVersions);
                if ($conflictCount > 0) {
                    echo "  ✗ All {$conflictCount} available versions conflict with pimcore/platform-version" . PHP_EOL;
                }

                // PHP version requirements
                preg_match_all("/require php\s+(.+?)\s*->\s*your php version \(([^)]+)\)/", $block, $phpReqs, PREG_SET_ORDER);
                $seenPhp = [];
                foreach ($phpReqs as $req) {
                    $key = $req[1];
                    if (!isset($seenPhp[$key])) {
                        $seenPhp[$key] = true;
                        echo "  ✗ Some versions require PHP {$req[1]} (installed: {$req[2]})" . PHP_EOL;
                    }
                }

                // Dependency constraint mismatches (e.g. requires studio-backend-bundle ^1.0 but no match)
                preg_match_all("/(\S+)\s+requires\s+(\S+)\s+(\S+)\s*->.*but it does not match/", $block, $depReqs, PREG_SET_ORDER);
                foreach ($depReqs as $req) {
                    echo "  ✗ {$req[1]} requires {$req[2]} {$req[3]} — no matching version found" . PHP_EOL;
                }

                echo PHP_EOL;
            }
            '
            exit 2
          }
