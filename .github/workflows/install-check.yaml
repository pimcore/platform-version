name: Install Check

on:
  workflow_dispatch:

jobs:
  Install-Check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install jq
        run: sudo apt-get install jq

      - name: Install SSH Key # this is necessary for Composer to be able to clone source from pimcore/ee-pimcore
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER }}
          known_hosts: ".... we add this in the next step ;-)"

      - name: "Add authentication for private pimcore packages"
        run: |
          composer config repositories.private-packagist composer https://repo.pimcore.com/github-actions/
          composer config --global --auth http-basic.repo.pimcore.com github-actions ${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}

      - name: Read and modify composer.json
        id: update_composer
        run: |
          original_content=$(<composer.json)
          for conflict in $(echo "$original_content" | jq -r '.conflict | to_entries[] | @base64'); do
            _jq() {
              echo ${conflict} | base64 --decode | jq -r ${1}
            }
            package_name=$(_jq '.key')
            composer require "$package_name:*" --no-update
          done

      - name: Check dependency resolution
        run: |
          output=$(composer update --dry-run 2>&1) && echo "$output" || {
            echo "$output" | awk '
              /^Your requirements could not be resolved/ { print; next }
              /^$/ && in_problem { in_problem=0; print ""; next }
              /Problem [0-9]+/ { in_problem=1; print; next }
              in_problem && /is present at version/ { print; next }
              in_problem && /Root composer\.json requires/ {
                # Trim the long version list: keep up to the first "satisfiable by pkg[..." then add "]."
                line = $0
                if (match(line, /satisfiable by [^[]+\[/)) {
                  print substr(line, 1, RSTART+RLENGTH-1) "...]."
                } else {
                  print
                }
                next
              }
              in_problem && /conflicts with/ && !seen_conflict[in_problem] {
                seen_conflict[in_problem]=1
                print "    - " "pimcore/platform-version conflicts with all available versions of this package."
                next
              }
              in_problem && /does not satisfy|does not match/ && !seen_php[in_problem] {
                seen_php[in_problem]=1
                print
                next
              }
              in_problem && /require php/ && !seen_php[in_problem] {
                seen_php[in_problem]=1
                print
                next
              }
            '
            exit 2
          }
