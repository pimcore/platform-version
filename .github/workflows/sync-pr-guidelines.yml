name: Sync PR Guidelines to all Pimcore repos

on:
  push:
    paths:
      - ".github/PULL_REQUEST_GUIDELINES.md"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate target repo list
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          repos=$(gh repo list pimcore --no-archived --source --limit 1000 --json nameWithOwner \
            --jq '.[].nameWithOwner' | grep -v '^pimcore/platform-version$')

          {
            echo "group:"
            echo "  - files:"
            echo "      - source: .github/PULL_REQUEST_GUIDELINES.md"
            echo "        dest: .github/PULL_REQUEST_GUIDELINES.md"
            echo "    repos: |"
            echo "$repos" | sed 's/^/      /'
          } > sync-config.generated.yaml

      - name: Sync file to target repos
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }}
          CONFIG_PATH: sync-config.generated.yaml
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_USERNAME: ${{ secrets.GIT_NAME }}
          PR_LABELS: 'automated-sync'
          ORIGINAL_MESSAGE: true
          COMMIT_AS_PR_TITLE: true
          COMMIT_EACH_FILE: false
