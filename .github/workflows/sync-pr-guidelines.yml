name: Sync CONTRIBUTING.md to all Pimcore repos

on:
  push:
    paths:
      - "CONTRIBUTING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate target repo list
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repos=$(gh repo list pimcore --no-archived --source --limit 1000 --json nameWithOwner \
            --jq '.[].nameWithOwner' | grep -v '^pimcore/platform-version$')

          {
            echo "group:"
            echo "  - files:"
            echo "      - source: CONTRIBUTING.md"
            echo "        dest: CONTRIBUTING.md"
            echo "    repos: |"
            echo "$repos" | sed 's/^/      /'
          } > sync-config.generated.yaml

      - name: Sync file to target repos
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }}
          CONFIG_PATH: sync-config.generated.yaml
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_USERNAME: ${{ secrets.GIT_NAME }}
          PR_LABELS: 'automated-sync'
          ORIGINAL_MESSAGE: true
          COMMIT_AS_PR_TITLE: true
          COMMIT_EACH_FILE: false
