name: "Composer outdated check - monthly minor check"

on:
    workflow_dispatch:
    schedule:
        - cron:  '0 7 1 * *'

permissions:
  contents: read

jobs:
    composer-checks:
        uses: pimcore/workflows-collection-public/.github/workflows/reusable-composer-checks.yaml@main
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { php-version: 8.4, branch: 2025.4 }
                    - { php-version: 8.3, branch: 2025.4 }
                    - { php-version: 8.4, branch: 2026.3 }
                    - { php-version: 8.4, branch: 2026.x }
        with:
            php-version: ${{ matrix.php-version }}
            branch: ${{ matrix.branch }}
            ignore-list: "public"
            platform-repo: true
            version-type: "-m"
            private-repo: true
        secrets: inherit