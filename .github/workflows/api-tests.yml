name: API Tests

on:
  schedule:
    - cron: '0 3 * * 1,2,3,4,5'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        default: '2026.x'
        type: choice
        options:
          - '2026.2'
          - '2026.x'
      platform_version:
        description: 'Platform version (e.g. 2026.2, 2026.2.x or 2026.x)'
        default: '2026.x'
        type: string

env:
  PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_CI_ENCRYPTION_SECRET }}
  PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_CI_INSTANCE_IDENTIFIER }}
  PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_CI_PRODUCT_KEY }}

jobs:
  api-tests:
    name: api-tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLATFORM_VERSION: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        # ref = git branch checked out (test code); platform = version installed
        # schedule legs: 2026.2 release (^2026.2), 2026.2 dev branch (2026.2.x-dev), 2026.x dev branch (2026.x-dev)
        include: ${{ github.event_name == 'schedule' && fromJSON('[{"ref":"2026.2","platform":"2026.2"},{"ref":"2026.2","platform":"2026.2.x"},{"ref":"2026.x","platform":"2026.x"}]') || fromJSON(format('[{{"ref":"{0}","platform":"{1}"}}]', inputs.branch, inputs.platform_version || inputs.branch)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      - name: Increase vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Setup environment (create-project, start containers)
        run: bash .github/scripts/01-setup-environment.sh "${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}" "${{ env.PLATFORM_VERSION }}" --ci

      - name: Install Pimcore (composer require + installer)
        run: bash .github/scripts/02-install-pimcore.sh "${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}" "${{ env.PLATFORM_VERSION }}" --ci

      - name: Verify Pimcore is responding
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8088/pimcore-studio > /dev/null 2>&1; then
              echo "Pimcore is up!"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Pimcore did not respond after 150s"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright
        working-directory: ./tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: ./tests
        env:
          PIMCORE_BASE_URL: http://localhost:8088
          PIMCORE_USERNAME: admin
          PIMCORE_PASSWORD: admin
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.platform }}
          path: tests/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: tests/test-results/
          retention-days: 30

      - name: Shutdown
        if: always()
        run: bash .github/scripts/04-shutdown.sh
