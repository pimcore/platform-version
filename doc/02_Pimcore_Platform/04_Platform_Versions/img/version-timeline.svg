<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .axis-line { stroke: #94a3b8; stroke-width: 1; }
      .axis-label { font-size: 12px; fill: #475569; text-anchor: middle; }
      .version-label { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .lts-badge { font-size: 10px; fill: #fff; font-weight: 700; }
      .bar-active { fill: #22c55e; }
      .bar-lts { fill: #eab308; }
      .bar-eol { fill: #cbd5e1; }
      .bar-future { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 3; }
      .today-line { stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 4; }
      .today-label { font-size: 11px; fill: #6366f1; font-weight: 600; text-anchor: middle; }
      .title { font-size: 18px; fill: #0f172a; font-weight: 700; }
      .legend-text { font-size: 11px; fill: #475569; }
      .grid-line { stroke: #e2e8f0; stroke-width: 0.5; }
      .tick-line { stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" rx="8" fill="#f8fafc"/>
  <rect x="0" y="0" width="900" height="48" rx="8" fill="#f1f5f9"/>
  <rect x="0" y="8" width="900" height="40" fill="#f1f5f9"/>

  <!-- Title -->
  <text x="40" y="32" class="title">Pimcore Platform Version Support Timeline</text>

  <!--
    Timeline area:
    x: 160 to 860 = 700px for 2022-2029 (7 years)
    Each year = 100px
    y: rows start at 80, each row 50px tall, bar height 28px
  -->

  <!-- Vertical grid lines for each year -->
  <line x1="160" y1="60" x2="160" y2="320" class="grid-line"/>
  <line x1="260" y1="60" x2="260" y2="320" class="grid-line"/>
  <line x1="360" y1="60" x2="360" y2="320" class="grid-line"/>
  <line x1="460" y1="60" x2="460" y2="320" class="grid-line"/>
  <line x1="560" y1="60" x2="560" y2="320" class="grid-line"/>
  <line x1="660" y1="60" x2="660" y2="320" class="grid-line"/>
  <line x1="760" y1="60" x2="760" y2="320" class="grid-line"/>
  <line x1="860" y1="60" x2="860" y2="320" class="grid-line"/>

  <!-- Half-year grid lines (lighter) -->
  <line x1="210" y1="60" x2="210" y2="320" class="grid-line" stroke-dasharray="2 4"/>
  <line x1="310" y1="60" x2="310" y2="320" class="grid-line" stroke-dasharray="2 4"/>
  <line x1="410" y1="60" x2="410" y2="320" class="grid-line" stroke-dasharray="2 4"/>
  <line x1="510" y1="60" x2="510" y2="320" class="grid-line" stroke-dasharray="2 4"/>
  <line x1="610" y1="60" x2="610" y2="320" class="grid-line" stroke-dasharray="2 4"/>
  <line x1="710" y1="60" x2="710" y2="320" class="grid-line" stroke-dasharray="2 4"/>
  <line x1="810" y1="60" x2="810" y2="320" class="grid-line" stroke-dasharray="2 4"/>

  <!-- Horizontal axis -->
  <line x1="160" y1="320" x2="860" y2="320" class="axis-line"/>

  <!-- Year tick marks and labels -->
  <line x1="160" y1="320" x2="160" y2="326" class="tick-line"/>
  <text x="160" y="340" class="axis-label">2022</text>
  <line x1="260" y1="320" x2="260" y2="326" class="tick-line"/>
  <text x="260" y="340" class="axis-label">2023</text>
  <line x1="360" y1="320" x2="360" y2="326" class="tick-line"/>
  <text x="360" y="340" class="axis-label">2024</text>
  <line x1="460" y1="320" x2="460" y2="326" class="tick-line"/>
  <text x="460" y="340" class="axis-label">2025</text>
  <line x1="560" y1="320" x2="560" y2="326" class="tick-line"/>
  <text x="560" y="340" class="axis-label">2026</text>
  <line x1="660" y1="320" x2="660" y2="326" class="tick-line"/>
  <text x="660" y="340" class="axis-label">2027</text>
  <line x1="760" y1="320" x2="760" y2="326" class="tick-line"/>
  <text x="760" y="340" class="axis-label">2028</text>
  <line x1="860" y1="320" x2="860" y2="326" class="tick-line"/>
  <text x="860" y="340" class="axis-label">2029</text>

  <!--
    Coordinate mapping:
    2022.0 = x160, 2022.5 = x210, 2023.0 = x260, 2023.25 = x285, 2023.5 = x310
    2023.75 = x335 (Q3 2023), 2024.0 = x360, 2024.25 = x385, 2024.5 = x410
    2024.75 = x435 (Q4 2024 start), 2025.0 = x460, 2025.67 = x527 (Aug 2025)
    2025.75 = x535 (Q4 2025), 2026.0 = x560, 2026.2 = x580 (Mar 2026)
    2026.25 = x585 (Q1 2026), 2027.0 = x660, 2028.0 = x760, 2029.0 = x860

    Row positions (y center of each row):
    Row 1: y=90  (2022.0)
    Row 2: y=140 (2023.3)
    Row 3: y=190 (2024.4)
    Row 4: y=240 (2025.4)
    Row 5: y=290 (2026.1)

    Bar top = y - 14, height = 28
  -->

  <!-- ============ ROW 1: 2022.0 LTS ============ -->
  <!-- Label -->
  <text x="148" y="94" class="version-label" text-anchor="end">2022.0</text>
  <!-- Active support: mid-2022 (x210) to Q3 2023 (x335) -->
  <rect x="210" y="76" width="125" height="28" rx="4" class="bar-active"/>
  <!-- LTS security: Q3 2023 (x335) to Aug 2025 (x527) -->
  <rect x="335" y="76" width="192" height="28" rx="4" class="bar-lts"/>
  <!-- EOL: Aug 2025 (x527) to end of display -->
  <rect x="527" y="76" width="50" height="28" rx="4" class="bar-eol"/>
  <!-- LTS badge -->
  <rect x="210" y="78" width="30" height="14" rx="3" fill="#15803d"/>
  <text x="225" y="89" class="lts-badge" text-anchor="middle">LTS</text>

  <!-- ============ ROW 2: 2023.3 LTS ============ -->
  <text x="148" y="144" class="version-label" text-anchor="end">2023.3</text>
  <!-- Active support: Q3 2023 (x335) to Q4 2024 (x435) -->
  <rect x="335" y="126" width="100" height="28" rx="4" class="bar-active"/>
  <!-- LTS security: Q4 2024 (x435) to Dec 2025 (x560) -->
  <rect x="435" y="126" width="125" height="28" rx="4" class="bar-lts"/>
  <!-- EOL: Dec 2025 (x560) to end of display -->
  <rect x="560" y="126" width="50" height="28" rx="4" class="bar-eol"/>
  <!-- LTS badge -->
  <rect x="335" y="128" width="30" height="14" rx="3" fill="#15803d"/>
  <text x="350" y="139" class="lts-badge" text-anchor="middle">LTS</text>

  <!-- ============ ROW 3: 2024.4 LTS ============ -->
  <text x="148" y="194" class="version-label" text-anchor="end">2024.4</text>
  <!-- Active support: Q4 2024 (x435) to Q4 2025 (x535) -->
  <rect x="435" y="176" width="100" height="28" rx="4" class="bar-active"/>
  <!-- LTS security: Q4 2025 (x535) to Dec 2026 (x560 + 100 = x660) -->
  <rect x="535" y="176" width="125" height="28" rx="4" class="bar-lts"/>
  <!-- LTS badge -->
  <rect x="435" y="178" width="30" height="14" rx="3" fill="#15803d"/>
  <text x="450" y="189" class="lts-badge" text-anchor="middle">LTS</text>

  <!-- ============ ROW 4: 2025.4 LTS ============ -->
  <text x="148" y="244" class="version-label" text-anchor="end">2025.4</text>
  <!-- Active support: Q4 2025 (x535) to Q4 2026 (~x635) -->
  <rect x="535" y="226" width="100" height="28" rx="4" class="bar-active"/>
  <!-- LTS security: Q4 2026 (x635) to Dec 2028 (x760 + 100 = x860) -->
  <rect x="635" y="226" width="225" height="28" rx="4" class="bar-lts"/>
  <!-- LTS badge -->
  <rect x="535" y="228" width="30" height="14" rx="3" fill="#15803d"/>
  <text x="550" y="239" class="lts-badge" text-anchor="middle">LTS</text>

  <!-- ============ ROW 5: 2026.1 (future) ============ -->
  <text x="148" y="294" class="version-label" text-anchor="end">2026.1</text>
  <!-- Future: dashed bar starting Q1 2026 (x585) extending to Q2 2026 (x610) -->
  <rect x="585" y="276" width="75" height="28" rx="4" class="bar-future"/>
  <text x="622" y="294" font-size="10" fill="#94a3b8" text-anchor="middle" font-style="italic">planned</text>

  <!-- ============ TODAY MARKER ============ -->
  <!-- March 2026 = 2026 + 2/12 = 2026.167, x = 560 + 16.7 = ~577 -->
  <line x1="577" y1="58" x2="577" y2="320" class="today-line"/>
  <text x="577" y="70" class="today-label">Today</text>
  <!-- Small triangle pointer -->
  <polygon points="577,58 573,52 581,52" fill="#6366f1"/>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(560, 350)">
    <rect x="0" y="0" width="14" height="14" rx="3" class="bar-active"/>
    <text x="18" y="11" class="legend-text">Active Support</text>

    <rect x="120" y="0" width="14" height="14" rx="3" class="bar-lts"/>
    <text x="138" y="11" class="legend-text">LTS (Security Only)</text>

    <rect x="275" y="0" width="14" height="14" rx="3" class="bar-eol"/>
    <text x="293" y="11" class="legend-text">End of Life</text>
  </g>
</svg>